                    </nav>

                    {/* Hero Section */}
                    <section className="relative z-10 px-6 pt-20 pb-32 flex flex-col items-center text-center max-w-5xl mx-auto">
                        <div className="inline-flex py-1 px-3 mb-6 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold uppercase tracking-widest animate-pulse">
                            Secure Wealth Management
                        </div>
                        <h1 className="text-6xl md:text-8xl font-black text-white tracking-tighter leading-[0.9] mb-8">
                            Save Smarter. <br />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Live Better.</span>
                        </h1>
                        <p className="text-gray-400 text-xl max-w-2xl mb-12">
                            Yomola Global empowers you to build a secure financial future. Our sophisticated infrastructure
                            simplifies capital growth with elite-level transparency and 3D security.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6">
                            <Button variant="primary" onClick={onGetStarted} className="text-xl px-12 py-5 glow">
                                Get Started Today
                            </Button>
                            <Button variant="secondary" className="text-xl px-12 py-5 border-white/10 glass">
                                Contact Support
                            </Button>
                        </div>

                        {/* 3D Visual Mockup */}
                        <div className="mt-24 relative w-full max-w-4xl mx-auto perspective-1000">
                            <div className="glass border-white/20 rounded-3xl p-4 shadow-2xl transform rotateX(15deg) transition-transform hover:rotateX(5deg) duration-700">
                                <div className="bg-[#0f172a] rounded-2xl p-8 h-[400px] flex flex-col justify-center items-center relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-600/5 to-transparent"></div>
                                    <Icon name="shield-check" className="w-48 h-48 text-blue-500/20 mb-8 animate-float" />
                                    <div className="text-center">
                                        <h4 className="text-2xl font-bold text-white mb-2">Multi-Layer Ledger Security</h4>
                                        <p className="text-gray-500">Your assets are protected by enterprise-grade encryption and 3D depth verification protocols.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* About Section */}
                    <section id="about" className="relative z-10 px-6 py-32 max-w-7xl mx-auto border-t border-white/5">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-20 items-center">
                            <div>
                                <h2 className="text-5xl font-black text-white mb-8 tracking-tighter">Premier Wealth <br /><span className="text-blue-500">Infrastructure.</span></h2>
                                <p className="text-gray-400 text-lg leading-relaxed mb-6">
                                    Yomola Global is more than a savings platform; it is a meticulously engineered financial ecosystem.
                                    Our mission is to bridge the gap between traditional savings and modern digital asset management.
                                </p>
                                <p className="text-gray-400 text-lg leading-relaxed">
                                    Founded on the principles of transparency and absolute security, we provide the tools for
                                    individuals and institutions to grow their capital with confidence.
                                </p>
                            </div>
                            <div className="grid grid-cols-2 gap-6">
                                <Card className="border-blue-500/20 p-8 text-center">
                                    <h4 className="text-4xl font-black text-white mb-2">100%</h4>
                                    <p className="text-xs text-gray-500 uppercase font-black">Transparency</p>
                                </Card>
                                <Card className="border-emerald-500/20 p-8 text-center">
                                    <h4 className="text-4xl font-black text-white mb-2">24/7</h4>
                                    <p className="text-xs text-gray-500 uppercase font-black">Monitoring</p>
                                </Card>
                                <Card className="border-indigo-500/20 p-8 text-center">
                                    <h4 className="text-4xl font-black text-white mb-2">3D</h4>
                                    <p className="text-xs text-gray-500 uppercase font-black">Security</p>
                                </Card>
                                <Card className="border-orange-500/20 p-8 text-center">
                                    <h4 className="text-4xl font-black text-white mb-2">Elite</h4>
                                    <p className="text-xs text-gray-500 uppercase font-black">Service</p>
                                </Card>
                            </div>
                        </div>
                    </section>

                    {/* Solutions Section */}
                    <section id="solutions" className="relative z-10 bg-white/5 py-32 px-6 overflow-hidden">
                        <div className="max-w-7xl mx-auto">
                            <div className="text-center mb-20">
                                <h2 className="text-5xl font-black text-white tracking-tighter">Strategic Solutions</h2>
                                <p className="text-gray-400 mt-4 text-lg">Architected for growth, designed for stability.</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                {[
                                    { title: "Smart Vaulting", icon: "wallet", desc: "Our intelligent vault system automates your savings goals with precision interest tracking." },
                                    { title: "Real-time Ledger", icon: "list-checks", desc: "Access your financial history with absolute clarity. Every transaction is logged and verifiable." },
                                    { title: "Institutional Grade", icon: "shield", desc: "Experience the same security protocols used by leading financial institutions globally." }
                                ].map((f, i) => (
                                    <div key={i} className="glass p-12 rounded-[2.5rem] hover:bg-white/10 transition group cursor-default border-white/5">
                                        <div className="p-6 bg-blue-600/10 text-blue-400 rounded-3xl inline-block mb-8 group-hover:scale-110 transition-transform">
                                            <Icon name={f.icon} className="w-10 h-10" />
                                        </div>
                                        <h3 className="text-3xl font-bold text-white mb-6 tracking-tight">{f.title}</h3>
                                        <p className="text-gray-400 text-lg leading-relaxed">{f.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="relative z-10 px-6 py-20 border-t border-white/5 text-center max-w-7xl mx-auto">
                        <div className="flex flex-col items-center">
                            <div className="p-3 bg-blue-600 rounded-xl mb-6">
                                <Icon name="activity" className="text-white w-8 h-8" />
                            </div>
                            <h3 className="text-2xl font-bold text-white mb-4 tracking-tighter">Yomola Global</h3>
                            <p className="text-gray-500 text-sm max-w-md">
                                All funds are managed under strict regulatory compliance and protected by advanced cryptographic protocols.
                                © 2026 Yomola Global. Secure Financial Future.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- PORTAL CHOICE ---
        const PortalChoice = ({ onSelect, onBack }) => {
            return (
                <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-4">
                    <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/20 via-transparent to-transparent"></div>
                    <div className="relative z-10 w-full max-w-4xl">
                        <div className="text-center mb-16">
                            <h2 className="text-5xl font-black text-white mb-6 tracking-tighter">Choose Your Gateway</h2>
                            <p className="text-gray-400 text-lg">Select the appropriate portal to access the Yomola Global ecosystem.</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <button onClick={() => onSelect('client')} className="glass group p-10 rounded-[2.5rem] text-left hover:bg-white/10 transition-all hover:-translate-y-2 border-white/5 hover:border-blue-500/50">
                                <div className="p-5 bg-blue-600/10 text-blue-400 rounded-3xl inline-block mb-8 group-hover:scale-110 transition-transform shadow-2xl shadow-blue-500/10">
                                    <Icon name="user" className="w-10 h-10" />
                                </div>
                                <h3 className="text-3xl font-bold text-white mb-3">Client Workspace</h3>
                                <p className="text-gray-400 text-lg">Manage personal savings, track transactions, and download statements in real-time.</p>
                                <div className="mt-8 flex items-center gap-2 text-blue-400 font-bold group-hover:translate-x-2 transition-transform">
                                    Continue to Savings <Icon name="arrow-right" />
                                </div>
                            </button>

                            <button onClick={() => onSelect('admin')} className="glass group p-10 rounded-[2.5rem] text-left hover:bg-white/10 transition-all hover:-translate-y-2 border-white/5 hover:border-orange-500/50">
                                <div className="p-5 bg-orange-600/10 text-orange-400 rounded-3xl inline-block mb-8 group-hover:scale-110 transition-transform shadow-2xl shadow-orange-500/10">
                                    <Icon name="shield" className="w-10 h-10" />
                                </div>
                                <h3 className="text-3xl font-bold text-white mb-3">Administration</h3>
                                <p className="text-gray-400 text-lg">Central hub for staff to manage clients, record transactions, and generate system reports.</p>
                                <div className="mt-8 flex items-center gap-2 text-orange-400 font-bold group-hover:translate-x-2 transition-transform">
                                    Access Command Center <Icon name="arrow-right" />
                                </div>
                            </button>
                        </div>
                        <button onClick={onBack} className="mt-12 w-full text-gray-500 hover:text-white transition flex items-center justify-center gap-2">
                            <Icon name="arrow-left" /> Back to Website
                        </button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('landing');
            const [portalType, setPortalType] = useState(null);
            const [user, setUser] = useState(null);
            const [ready, setReady] = useState(false);

            useEffect(() => { setTimeout(() => setReady(true), 800); }, []);

            if (!ready) return <div className="h-screen bg-[#0f172a] flex items-center justify-center"><div className="w-16 h-16 border-4 border-blue-600/20 border-t-blue-500 rounded-full animate-spin"></div></div>;

            const handleLoginSuccess = (userData) => {
                setUser(userData);
                setView('dashboard');
            };

            const handleLogout = () => {
                setUser(null);
                setView('landing');
            };

            if (view === 'landing') return <LandingPage onGetStarted={() => setView('choice')} />;
            if (view === 'choice') return <PortalChoice onSelect={(type) => { setPortalType(type); setView('auth'); }} onBack={() => setView('landing')} />;
            if (view === 'auth') return <AuthScreen forceStep={portalType === 'admin' ? 'admin' : 'phone'} onLoginSuccess={handleLoginSuccess} onBack={() => setView('choice')} />;
            if (view === 'dashboard' && user) return <Dashboard user={user} onLogout={handleLogout} />;

            return <div className="h-screen bg-[#0f172a] flex items-center justify-center text-gray-500">Loading Application...</div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
