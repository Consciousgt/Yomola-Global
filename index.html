<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yomola Global - Save for the Future</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">

    <!-- UI Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCXm7IybpnE17zdXnbo7OdD32KSTXKqmSY",
            authDomain: "yomola-global-1f552.firebaseapp.com",
            projectId: "yomola-global-1f552",
            storageBucket: "yomola-global-1f552.firebasestorage.app",
            messagingSenderId: "884873998736",
            appId: "1:884873998736:web:b48cf603c4f55f91ee0315",
            measurementId: "G-LTJ10SLL4Y"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- UTILS ---
        let currentCurrency = '₦';
        const formatMoney = (amount) => currentCurrency + (amount || 0).toLocaleString();
        const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString();

        // --- DATABASE SERVICE ---
        const CloudStorage = {
            loadSettings: async () => {
                try {
                    const doc = await db.collection('app').doc('settings').get();
                    if (doc.exists) return doc.data();
                    const defaultSettings = {
                        businessName: 'Yomola Global',
                        adminPin: '0000',
                        theme: 'dark',
                        currency: 'NGN',
                        maintenanceMode: false,
                        systemAlert: ''
                    };
                    await db.collection('app').doc('settings').set(defaultSettings);
                    return defaultSettings;
                } catch (e) { return { businessName: 'Yomola Global', adminPin: '0000', theme: 'dark', currency: 'NGN' }; }
            },
            updateSettings: async (settings) => {
                await db.collection('app').doc('settings').update(settings);
            },
            loadClients: async () => {
                const snapshot = await db.collection('clients').orderBy('name').get();
                return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            },
            addClient: async (clientData) => {
                const docRef = await db.collection('clients').add({
                    ...clientData,
                    balance: 0,
                    passwordCreated: false,
                    createdAt: new Date().toISOString()
                });
                return { id: docRef.id, ...clientData };
            },
            updateClient: async (clientId, data) => {
                await db.collection('clients').doc(clientId).update(data);
            },
            deleteClient: async (clientId) => {
                const batch = db.batch();
                // We should also delete their transactions to keep the ledger clean OR just mark them as 'orphaned'
                // For now, standard deletion of the client profile
                batch.delete(db.collection('clients').doc(clientId));
                await batch.commit();
            },
            getClientByPhone: async (phone) => {
                const snapshot = await db.collection('clients').where('phone', '==', phone).limit(1).get();
                if (snapshot.empty) return null;
                return { ...snapshot.docs[0].data(), id: snapshot.docs[0].id };
            },
            loadStaff: async () => {
                const snapshot = await db.collection('staff').orderBy('name').get();
                return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            },
            addStaff: async (staffData) => {
                const docRef = await db.collection('staff').add({
                    ...staffData,
                    createdAt: new Date().toISOString()
                });
                return { id: docRef.id, ...staffData };
            },
            deleteStaff: async (staffId) => {
                await db.collection('staff').doc(staffId).delete();
            },
            getStaffByPin: async (pin) => {
                const snapshot = await db.collection('staff').where('pin', '==', pin).limit(1).get();
                if (snapshot.empty) return null;
                return { ...snapshot.docs[0].data(), id: snapshot.docs[0].id };
            },
            updateClientPassword: async (clientId, password, email) => {
                await db.collection('clients').doc(clientId).update({
                    password,
                    email,
                    passwordCreated: true
                });
            },
            loadTransactions: async (clientId = null) => {
                let query = db.collection('transactions').orderBy('date', 'desc');
                if (clientId) query = query.where('clientId', '==', clientId);
                const snapshot = await query.get();
                return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            },
            addTransaction: async (tx, currentBalance) => {
                const batch = db.batch();
                const txId = Date.now().toString();
                const txRef = db.collection('transactions').doc(txId);
                batch.set(txRef, tx);
                const clientRef = db.collection('clients').doc(tx.clientId);
                const newBalance = tx.type === 'DEPOSIT' ? (currentBalance + tx.amount) : (currentBalance - tx.amount);
                batch.update(clientRef, { balance: newBalance });
                await batch.commit();
            },
            addRequest: async (request) => {
                await db.collection('requests').add({
                    ...request,
                    status: 'PENDING',
                    createdAt: new Date().toISOString()
                });
            },
            loadRequests: async () => {
                const snapshot = await db.collection('requests').orderBy('createdAt', 'desc').get();
                return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            }
        };

        // --- REPORT GENERATOR ---
        const ReportGenerator = {
            generateClientStatement: (client, transactions, businessName) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const primaryColor = [37, 99, 235]; // #2563eb

                // Header
                doc.setFillColor(...primaryColor);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.setFont('helvetica', 'bold');
                doc.text(businessName || 'Yomola Global', 15, 25);
                doc.setFontSize(10);
                doc.text('STATEMENT OF ACCOUNT', 15, 33);

                // Client Info Info Box
                doc.setFillColor(245, 250, 255);
                doc.rect(15, 50, 180, 40, 'F');
                doc.setTextColor(...primaryColor);
                doc.setFontSize(12);
                doc.text('CLIENT DETAILS', 25, 60);
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.text(`Name: ${client.name}`, 25, 70);
                doc.text(`Phone: ${client.phone}`, 25, 76);
                doc.text(`Wallet ID: ${client.id}`, 25, 82);

                // Balance Box
                doc.setFillColor(37, 99, 235);
                doc.rect(130, 50, 65, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(10);
                doc.text('CURRENT BALANCE', 135, 65);
                doc.setFontSize(18);
                doc.setFont('helvetica', 'bold');
                doc.text(formatMoney(client.balance), 135, 78);

                // Table
                const tableData = transactions.map(t => [
                    formatDate(t.date),
                    t.type,
                    t.method,
                    formatMoney(t.amount),
                    t.recordedBy || 'System'
                ]);

                doc.autoTable({
                    startY: 100,
                    head: [['Date', 'Type', 'Method', 'Amount', 'Officer']],
                    body: tableData,
                    theme: 'striped',
                    headStyles: { fillColor: primaryColor, textColor: 255, fontStyle: 'bold' },
                    alternateRowStyles: { fillColor: [249, 250, 251] },
                    margin: { top: 100 }
                });

                doc.save(`Statement_${client.name.replace(/\s+/g, '_')}_${Date.now()}.pdf`);
            },

            generateGeneralCashflow: (transactions, clients, businessName) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const accentColor = [15, 23, 42]; // #0f172a

                doc.setFillColor(...accentColor);
                doc.rect(0, 0, 210, 45, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(22);
                doc.text(businessName || 'Yomola Global', 15, 25);
                doc.setFontSize(12);
                doc.text('GENERAL CASHFLOW LEDGER', 15, 35);

                const totalInflow = transactions.filter(t => t.type === 'DEPOSIT').reduce((s, t) => s + t.amount, 0);
                const totalOutflow = transactions.filter(t => t.type === 'WITHDRAWAL').reduce((s, t) => s + t.amount, 0);

                doc.setFontSize(10);
                doc.text(`Total Inflow: ${formatMoney(totalInflow)}`, 200, 25, { align: 'right' });
                doc.text(`Total Outflow: ${formatMoney(totalOutflow)}`, 200, 35, { align: 'right' });

                const tableData = transactions.map(t => [
                    formatDate(t.date),
                    clients.find(c => c.id === t.clientId)?.name || 'Unknown',
                    t.type,
                    formatMoney(t.amount),
                    t.recordedBy || 'System'
                ]);

                doc.autoTable({
                    startY: 55,
                    head: [['Date', 'Client', 'Type', 'Amount', 'Recorded By']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: accentColor, textColor: 255 },
                    styles: { fontSize: 8 }
                });

                doc.save(`General_Cashflow_${Date.now()}.pdf`);
            },

            exportToExcel: (transactions, clients) => {
                const headers = ['Date', 'Client Name', 'Type', 'Amount', 'Method', 'Officer'];
                const rows = transactions.map(t => [
                    formatDate(t.date),
                    clients.find(c => c.id === t.clientId)?.name || 'Unknown',
                    t.type,
                    t.amount,
                    t.method,
                    t.recordedBy || 'System'
                ]);

                const csvContent = [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Cashflow_Export_${Date.now()}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        };

        // --- UI COMPONENTS ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`glass glass-card p-6 rounded-2xl ${className}`}>{children}</div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", disabled = false, icon }) => {
            const variants = {
                primary: "bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/40",
                secondary: "bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700",
                danger: "bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-900/40",
                success: "bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/40",
            };
            return (
                <button disabled={disabled} onClick={onClick} className={`px-6 py-3 rounded-xl font-bold transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 ${variants[variant]} ${className}`}>
                    {icon && <Icon name={icon} />}
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", value, onChange, placeholder, maxLength, icon, name, required = false, defaultValue }) => (
            <div className="space-y-2">
                {label && <label className="block text-sm font-medium text-gray-400">{label}</label>}
                <div className="relative">
                    {icon && <div className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"><Icon name={icon} /></div>}
                    <input defaultValue={defaultValue} name={name} type={type} value={value} onChange={onChange} placeholder={placeholder} maxLength={maxLength} required={required}
                        className={`w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 ${icon ? 'pl-12' : 'pl-4'} pr-4 focus:ring-2 focus:ring-blue-500 outline-none text-white placeholder-gray-600 transition-all`}
                    />
                </div>
            </div>
        );

        // --- AUTH SCREEN ---
        const AuthScreen = ({ onLoginSuccess, onBack, forceStep }) => {
            const [step, setStep] = useState(forceStep || 'phone');
            const [phone, setPhone] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [email, setEmail] = useState('');
            const [adminKey, setAdminKey] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [userContext, setUserContext] = useState(null);

            useEffect(() => {
                if (forceStep) setStep(forceStep);
                setError('');
            }, [forceStep]);

            const handlePhoneSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if (phone.length < 10) return setError("Enter a valid phone number");
                setLoading(true);
                const client = await CloudStorage.getClientByPhone(phone);
                setLoading(false);
                if (client) {
                    setUserContext(client);
                    client.passwordCreated ? setStep('login') : setStep('create');
                } else {
                    setError("Account not found. Please contact Admin.");
                }
            };

            const handleCreatePassword = async (e) => {
                e.preventDefault();
                setError('');
                if (password.length !== 4) return setError("PIN must be 4 characters");
                if (password !== confirmPassword) return setError("PINs do not match");
                if (!email.includes('@')) return setError("Valid email required");

                setLoading(true);
                try {
                    await CloudStorage.updateClientPassword(userContext.id, password, email);
                    onLoginSuccess({ ...userContext, role: 'client', password, email });
                } catch (e) { setError("Setup failed"); }
                setLoading(false);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === userContext.password) onLoginSuccess({ ...userContext, role: 'client' });
                else setError("Incorrect PIN");
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                const s = await CloudStorage.loadSettings();
                if (adminKey === s.adminPin) {
                    onLoginSuccess({ name: 'System Admin', role: 'admin' });
                    return;
                }
                const staff = await CloudStorage.getStaffByPin(adminKey);
                if (staff) {
                    onLoginSuccess({ ...staff, role: 'staff' });
                } else {
                    setError("Invalid Administrative Key");
                }
            };

            return (
                <div className="min-h-screen bg-[#0f172a] flex items-center justify-center p-4 auth-container">
                    <div className="w-full max-w-md auth-form">
                        <Card className="p-10 border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-blue-600/10 blur-3xl rounded-full tracking-tighter"></div>
                            <div className="mb-10 text-center">
                                <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-blue-500/20">
                                    <Icon name="shield-check" className="w-8 h-8" />
                                </div>
                                <h2 className="text-3xl font-black text-white tracking-tight">Security Portal</h2>
                                <p className="text-gray-500 mt-2 font-medium">Verify your identity to continue</p>
                            </div>

                            {error && <div className="mb-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl font-bold flex items-center gap-2 animate-shake"><Icon name="alert-circle" className="w-4 h-4" /> {error}</div>}

                            {step === 'phone' && (
                                <form onSubmit={handlePhoneSubmit} className="space-y-6">
                                    <Input label="Phone Number" icon="phone" value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g, ''))} placeholder="080..." maxLength={11} />
                                    <Button className="w-full" disabled={loading}>{loading ? 'Verifying...' : 'Continue'}</Button>
                                </form>
                            )}
                            {step === 'create' && (
                                <form onSubmit={handleCreatePassword} className="space-y-4">
                                    <p className="text-sm text-blue-400 bg-blue-500/10 p-3 rounded-lg">Welcome! Please create a secure 4-digit PIN for your account.</p>
                                    <Input type="password" label="Create 4-Digit PIN" icon="lock" value={password} onChange={e => setPassword(e.target.value)} maxLength={4} />
                                    <Input type="password" label="Confirm PIN" icon="check-circle" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} maxLength={4} />
                                    <Input type="email" label="Recovery Email" icon="mail" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" />
                                    <Button className="w-full" variant="success">Initialize Account</Button>
                                </form>
                            )}
                            {step === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-6">
                                    <p className="text-gray-300">Welcome, <span className="text-white font-bold">{userContext.name}</span></p>
                                    <Input type="password" label="Enter PIN" icon="key" value={password} onChange={e => setPassword(e.target.value)} maxLength={4} />
                                    <Button className="w-full">Unlock Dashboard</Button>
                                </form>
                            )}
                            {step === 'admin' && (
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <h2 className="text-xl font-bold text-orange-400 text-center">Administrative Access</h2>
                                    <Input type="password" label="4-Digit Portal Key" icon="shield" value={adminKey} onChange={e => setAdminKey(e.target.value)} maxLength={4} />
                                    <Button className="w-full" variant="danger">Access Terminal</Button>
                                </form>
                            )}
                            <button onClick={onBack} className="w-full text-sm text-gray-500 mt-6 hover:text-gray-300 transition">Back to Selection</button>
                        </Card>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD ---
        const Dashboard = ({ user, onLogout }) => {
            const isFullAdmin = user.role === 'admin';
            const isStaff = user.role === 'staff';
            const isAdminView = isFullAdmin || isStaff;

            const [view, setView] = useState('home');
            const [transactions, setTransactions] = useState([]);
            const [clients, setClients] = useState([]);
            const [staff, setStaff] = useState([]);
            const [requests, setRequests] = useState([]);
            const [loading, setLoading] = useState(true);
            const [modal, setModal] = useState(null); // { type, data }
            const [settings, setSettings] = useState({
                businessName: 'Yomola Global',
                adminPin: '0000',
                theme: 'dark',
                currency: 'NGN',
                maintenanceMode: false,
                systemAlert: ''
            });
            const [sidebarOpen, setSidebarOpen] = useState(false);

            const refreshData = async () => {
                setLoading(true);
                const s = await CloudStorage.loadSettings();
                setSettings(s);

                // Update Global Currency
                const currencySymbols = { 'NGN': '₦', 'USD': '$', 'EUR': '€', 'GBP': '£' };
                currentCurrency = currencySymbols[s.currency] || '₦';

                // Update Theme
                document.body.classList.toggle('light-theme', s.theme === 'light');

                if (isAdminView) {
                    const [cls, txs, stf, reqs] = await Promise.all([
                        CloudStorage.loadClients(),
                        CloudStorage.loadTransactions(),
                        CloudStorage.loadStaff(),
                        CloudStorage.loadRequests()
                    ]);
                    setClients(cls); setTransactions(txs); setStaff(stf); setRequests(reqs);
                } else {
                    const txs = await CloudStorage.loadTransactions(user.id);
                    setTransactions(txs);
                }
                setLoading(false);
            };

            useEffect(() => { refreshData(); }, [user]);

            // Sync theme when settings change locally
            useEffect(() => {
                document.body.classList.toggle('light-theme', settings.theme === 'light');
                const currencySymbols = { 'NGN': '₦', 'USD': '$', 'EUR': '€', 'GBP': '£' };
                currentCurrency = currencySymbols[settings.currency] || '₦';
            }, [settings.theme, settings.currency]);

            const balance = isAdminView ? clients.reduce((s, c) => s + (c.balance || 0), 0) : user.balance;

            const stats = useMemo(() => {
                if (!isAdminView) return null;
                const totalHoldings = clients.reduce((s, c) => s + (c.balance || 0), 0);
                const today = new Date().toISOString().split('T')[0];
                const todayDeposits = transactions
                    .filter(t => t.type === 'DEPOSIT' && t.date.startsWith(today))
                    .reduce((s, t) => s + t.amount, 0);
                const activeClients = clients.length;
                return { totalHoldings, todayDeposits, activeClients };
            }, [clients, transactions, isAdminView]);

            const handleTransactionSubmit = async (data) => {
                try {
                    const tx = {
                        clientId: data.clientId,
                        type: data.type,
                        amount: parseFloat(data.amount),
                        method: data.method,
                        date: new Date().toISOString(),
                        recordedBy: user.name
                    };
                    const client = clients.find(c => c.id === tx.clientId);
                    await CloudStorage.addTransaction(tx, client.balance);
                    setModal(null);
                    refreshData();
                } catch (e) { alert("Transaction failed"); }
            };

            const handleAddClient = async (data) => {
                try {
                    await CloudStorage.addClient(data);
                    setModal(null);
                    refreshData();
                } catch (e) { alert("Failed to add client"); }
            };

            const handleEditClient = async (clientId, data) => {
                try {
                    await CloudStorage.updateClient(clientId, data);
                    setModal(null);
                    refreshData();
                } catch (e) { alert("Update failed"); }
            };

            const handleDeleteClient = async (clientId) => {
                if (confirm("Are you sure you want to permanently delete this client? This cannot be undone.")) {
                    try {
                        await CloudStorage.deleteClient(clientId);
                        refreshData();
                    } catch (e) { alert("Deletion failed"); }
                }
            };

            const handleAddStaff = async (data) => {
                try {
                    await CloudStorage.addStaff(data);
                    setModal(null);
                    refreshData();
                } catch (e) { alert("Failed to add staff"); }
            };

            const handleRevokeStaff = async (staffId) => {
                if (confirm("Are you sure you want to revoke access?")) {
                    await CloudStorage.deleteStaff(staffId);
                    refreshData();
                }
            };

            const handleUpdateSettings = async (newSettings) => {
                try {
                    await CloudStorage.updateSettings(newSettings);
                    setSettings(newSettings);
                    alert("Settings updated successfully");
                } catch (e) { alert("Failed to update settings"); }
            };

            const handleRequestWithdrawal = async (data) => {
                try {
                    await CloudStorage.addRequest({
                        clientId: user.id,
                        clientName: user.name,
                        amount: parseFloat(data.amount),
                        method: data.method,
                        note: data.note || ''
                    });
                    setModal(null);
                    alert("Withdrawal request submitted for review.");
                    refreshData();
                } catch (e) { alert("Request failed"); }
            };

            return (
                <div className="flex h-screen bg-[#0f172a] overflow-hidden font-['Outfit'] relative">
                    {/* Mobile Menu Toggle */}
                    <button
                        onClick={() => setSidebarOpen(!sidebarOpen)}
                        className="lg:hidden absolute top-6 right-6 z-50 p-3 bg-blue-600 rounded-xl shadow-lg text-white"
                    >
                        <Icon name={sidebarOpen ? "x" : "menu"} />
                    </button>

                    {/* Sidebar */}
                    <aside className={`
                        fixed inset-y-0 left-0 z-40 w-64 glass border-r border-white/10 p-6 flex flex-col gap-8 transition-transform duration-300 transform
                        ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}
                        lg:relative lg:translate-x-0
                    `}>
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-500/20">
                                <Icon name="activity" className="text-white" />
                            </div>
                            <span className="font-bold text-xl tracking-tighter text-white">Yomola</span>
                        </div>
                        <nav className="flex-1 space-y-2">
                            <button onClick={() => { setView('home'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'home' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                <Icon name="layout-dashboard" /> Dashboard
                            </button>
                            {isAdminView && (
                                <>
                                    <button onClick={() => { setView('clients'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'clients' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                        <Icon name="users" /> Clients
                                    </button>
                                    <button onClick={() => { setView('transactions'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'transactions' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                        <Icon name="list" /> Transactions
                                    </button>
                                    <button onClick={() => { setView('requests'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'requests' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'} relative`}>
                                        <Icon name="bell" /> Requests
                                        {requests.filter(r => r.status === 'PENDING').length > 0 && <span className="absolute top-2 right-4 w-5 h-5 bg-red-500 text-white text-[10px] flex items-center justify-center rounded-full border-2 border-[#0f172a] font-bold">{requests.filter(r => r.status === 'PENDING').length}</span>}
                                    </button>
                                    <button onClick={() => { setView('reports'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'reports' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                        <Icon name="file-text" /> Reports
                                    </button>
                                    {isFullAdmin && (
                                        <>
                                            <button onClick={() => { setView('staff'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'staff' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                                <Icon name="shield-half" /> Staff
                                            </button>
                                            <button onClick={() => { setView('settings'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${view === 'settings' ? 'bg-blue-600 text-white shadow-xl' : 'text-gray-400 hover:bg-white/5'}`}>
                                                <Icon name="settings" /> Settings
                                            </button>
                                        </>
                                    )}
                                </>
                            )}
                        </nav>
                        <div className="pt-6 border-t border-white/5">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold shadow-lg shadow-blue-500/10 text-white">
                                    {user.name.charAt(0)}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-sm font-bold truncate text-white">{user.name}</p>
                                    <p className="text-xs text-gray-500 uppercase tracking-widest">{user.role}</p>
                                </div>
                            </div>
                            <button onClick={onLogout} className="w-full flex items-center gap-3 px-4 py-2 text-red-400 hover:bg-red-500/10 rounded-xl transition-colors">
                                <Icon name="log-out" /> Sign Out
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-4 md:p-12 relative">
                        {settings.systemAlert && (
                            <div className="mb-8 p-4 bg-blue-600/20 border border-blue-500/30 rounded-2xl flex items-center gap-4 animate-pulse">
                                <div className="p-2 bg-blue-600 rounded-lg">
                                    <Icon name="megaphone" className="text-white w-5 h-5" />
                                </div>
                                <div className="flex-1">
                                    <p className="text-[10px] font-black text-blue-400 uppercase tracking-widest">System Broadcast</p>
                                    <p className="text-white font-bold text-sm md:text-base">{settings.systemAlert}</p>
                                </div>
                            </div>
                        )}

                        <header className="mb-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            <div>
                                <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-2 text-white capitalize">
                                    {view === 'home' ? 'Central Command' : view}
                                </h2>
                                <p className="text-gray-500 text-sm">
                                    {isStaff ? 'Staff Terminal' : isFullAdmin ? 'System Command Center' : 'Personal Wealth Portal'}
                                </p>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                <Button variant="secondary" onClick={() => refreshData()} icon="refresh-cw" className="text-xs py-2 whitespace-nowrap">Sync</Button>
                                <Button variant="danger" onClick={onLogout} icon="log-out" className="text-xs py-2 whitespace-nowrap">Exit</Button>
                                {isFullAdmin && view === 'clients' && <Button onClick={() => setModal({ type: 'addClient' })} icon="user-plus" className="text-xs py-2 whitespace-nowrap">New Client</Button>}
                                {isFullAdmin && view === 'staff' && <Button onClick={() => setModal({ type: 'addStaff' })} icon="shield" className="text-xs py-2 whitespace-nowrap">Add Staff</Button>}
                            </div>
                        </header>

                        {view === 'home' && (
                            <div className="space-y-12">
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <Card className="lg:col-span-2 bg-gradient-to-br from-blue-900/40 to-indigo-900/20 border-blue-500/30 relative overflow-hidden backdrop-blur-xl">
                                        <Icon name="wallet" className="absolute -bottom-10 -right-10 w-64 h-64 text-blue-500/5 rotate-12" />
                                        <p className="text-sm font-medium text-blue-400 uppercase tracking-[0.2em] mb-4">{isAdminView ? 'Managed Wealth' : 'Personal Savings'}</p>
                                        <h3 className="text-7xl font-black mb-10 tracking-tighter text-white drop-shadow-2xl">{formatMoney(balance)}</h3>
                                        <div className="flex gap-4 relative z-10">
                                            {isAdminView ? (
                                                <>
                                                    <Button onClick={() => setModal({ type: 'transaction' })} variant="primary" className="glow scale-105">Record Entry</Button>
                                                    <Button variant="secondary" className="glass bg-white/5 border-white/10" onClick={() => ReportGenerator.generateGeneralCashflow(transactions, clients, settings.businessName)} icon="file-text">PDF Ledger</Button>
                                                    <Button variant="secondary" className="glass bg-white/5 border-white/10" onClick={() => ReportGenerator.exportToExcel(transactions, clients)} icon="table">Excel</Button>
                                                </>
                                            ) : (
                                                <>
                                                    <Button onClick={() => setModal({ type: 'withdrawal' })} variant="primary" className="glow">Withdrawal Request</Button>
                                                    <Button variant="secondary" className="glass bg-white/5 border-white/10" onClick={() => ReportGenerator.generateClientStatement(user, transactions, settings.businessName)} icon="download">Statement</Button>
                                                </>
                                            )}
                                        </div>
                                    </Card>
                                    <Card className="flex flex-col justify-between border-emerald-500/20 bg-emerald-500/5">
                                        <div>
                                            <div className="p-4 bg-emerald-500/20 text-emerald-400 rounded-2xl inline-block mb-6 shadow-2xl shadow-emerald-500/20 animate-pulse">
                                                <Icon name="trending-up" className="w-8 h-8" />
                                            </div>
                                            <h4 className="text-2xl font-bold text-white">System Status</h4>
                                            <p className="text-sm text-gray-400 mt-3 leading-relaxed">Infrastructure is active with 3D encryption and real-time reconciliation enabled.</p>
                                        </div>
                                        <div className="pt-6 border-t border-white/5 mt-6 flex justify-between items-center text-xs uppercase tracking-widest text-gray-500 font-bold">
                                            {!isAdminView && <Button variant="secondary" className="glass border-white/10 py-1 px-3 text-[10px]" onClick={() => ReportGenerator.generateClientStatement(user, transactions, settings.businessName)} icon="download">Statement</Button>}
                                            <span className="text-emerald-400">Verfied</span>
                                        </div>
                                    </Card>
                                </div>

                                {isAdminView && stats && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <Card className="border-emerald-500/20 bg-emerald-500/5 backdrop-blur-xl">
                                            <p className="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-4">Today's Deposits</p>
                                            <h4 className="text-3xl font-black text-white">{formatMoney(stats.todayDeposits)}</h4>
                                            <div className="mt-4 flex items-center gap-2 text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                                                <Icon name="clock" className="w-3 h-3" /> Daily Inflow
                                            </div>
                                        </Card>
                                        <Card className="border-indigo-500/20 bg-indigo-500/5 backdrop-blur-xl">
                                            <p className="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4">Active Clients</p>
                                            <h4 className="text-3xl font-black text-white">{stats.activeClients}</h4>
                                            <div className="mt-4 flex items-center gap-2 text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                                                <Icon name="users" className="w-3 h-3" /> Verified Wallets
                                            </div>
                                        </Card>
                                    </div>
                                )}

                                <div>
                                    <div className="flex justify-between items-center mb-8">
                                        <h3 className="text-3xl font-bold text-white tracking-tight">Recent Activity</h3>
                                        <button onClick={() => setView('transactions')} className="text-blue-400 text-sm font-bold hover:underline">View All Records</button>
                                    </div>
                                    <ActivityList loading={loading} transactions={transactions} isAdminView={isAdminView} />
                                </div>
                            </div>
                        )}

                        {
                            view === 'clients' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {clients.map(c => (
                                        <Card key={c.id} className="hover:bg-white/5 transition-colors group">
                                            <div className="flex justify-between items-start mb-6">
                                                <div className="w-12 h-12 bg-blue-600/10 text-blue-400 rounded-2xl flex items-center justify-center font-bold text-xl group-hover:scale-110 transition-transform text-white">
                                                    {c.name.charAt(0)}
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-1">Current Balance</p>
                                                    <p className="text-xl font-bold text-white">{formatMoney(c.balance)}</p>
                                                </div>
                                            </div>
                                            <h4 className="text-lg font-bold text-white truncate">{c.name}</h4>
                                            <p className="text-sm text-gray-500 mb-6">{c.phone}</p>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <Button variant="secondary" className="text-xs py-2 px-0 glass border-white/5" onClick={() => setModal({ type: 'transaction', data: c })}>Record</Button>
                                                <Button variant="secondary" className="text-xs py-2 px-0 glass border-white/5" disabled={!isFullAdmin} onClick={() => setModal({ type: 'editClient', data: c })}>Edit Profile</Button>
                                            </div>
                                            <div className="flex gap-2 mb-3">
                                                <Button variant="secondary" className="flex-1 text-xs py-2 px-0 glass border-white/10 text-blue-400" onClick={() => ReportGenerator.generateClientStatement(c, transactions.filter(t => t.clientId === c.id), settings.businessName)} icon="file-text">Statement</Button>
                                                {isFullAdmin && <Button variant="danger" className="flex-1 text-xs py-2 px-0 bg-red-500/10 text-red-400 border-red-500/20" onClick={() => handleDeleteClient(c.id)} icon="trash-2">Delete</Button>}
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            )
                        }

                        {
                            view === 'transactions' && (
                                <Card className="overflow-hidden p-0 border-white/5">
                                    <div className="p-6 border-b border-white/5 flex justify-between items-center">
                                        <h3 className="font-bold text-white">Full Transaction Ledger</h3>
                                        <div className="flex gap-2">
                                            <Button variant="secondary" className="text-xs py-1" onClick={() => ReportGenerator.exportToExcel(transactions, clients)} icon="table">Export Excel</Button>
                                            <Button variant="secondary" className="text-xs py-1" onClick={() => ReportGenerator.generateGeneralCashflow(transactions, clients, settings.businessName)} icon="printer">Print PDF</Button>
                                        </div>
                                    </div>
                                    <TransactionTable transactions={transactions} clients={clients} />
                                </Card>
                            )
                        }

                        {
                            view === 'reports' && (
                                <div className="space-y-6">
                                    <Card className="bg-gradient-to-r from-blue-600/20 to-indigo-600/20 border-blue-500/30">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h3 className="text-2xl font-bold text-white mb-2">Statement Generator</h3>
                                                <p className="text-gray-400 text-sm">Download or print full financial statements for your records.</p>
                                            </div>
                                            <div className="flex gap-4">
                                                <Button className="glass border-white/10" variant="secondary" onClick={() => ReportGenerator.exportToExcel(transactions, clients)} icon="table">Export Excel</Button>
                                                <Button className="glow" onClick={() => ReportGenerator.generateGeneralCashflow(transactions, clients, settings.businessName)} icon="download">Download PDF Ledger</Button>
                                            </div>
                                        </div>
                                    </Card>
                                    <Card className="p-0 overflow-hidden border-white/5">
                                        <div className="p-8 text-center bg-white/5 border-b border-white/5">
                                            <h2 className="text-2xl font-black text-white">{settings.businessName}</h2>
                                            <p className="text-xs text-gray-500 uppercase tracking-[0.3em] mt-2">Official Financial Statement</p>
                                        </div>
                                        <div className="p-8">
                                            <TransactionTable transactions={transactions} clients={clients} />
                                        </div>
                                    </Card>
                                </div>
                            )
                        }

                        {
                            view === 'staff' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {staff.map(s => (
                                        <Card key={s.id} className="border-orange-500/20 bg-orange-500/5">
                                            <div className="flex items-center gap-4 mb-6">
                                                <div className="w-12 h-12 bg-orange-500/20 text-orange-400 rounded-2xl flex items-center justify-center">
                                                    <Icon name="shield" className="w-6 h-6" />
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-white">{s.name}</h4>
                                                    <p className="text-xs text-orange-400 font-bold uppercase tracking-widest">Portal Access PIN: {s.pin}</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <Button variant="secondary" className="flex-1 text-xs glass border-white/5 py-2">Activity</Button>
                                                <Button variant="danger" className="flex-1 text-xs py-2" onClick={() => handleRevokeStaff(s.id)}>Revoke</Button>
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            )
                        }

                        {
                            view === 'settings' && (
                                <div className="max-w-3xl space-y-8">
                                    <Card className="p-8 border-blue-500/20 bg-blue-500/5">
                                        <div className="flex items-center gap-4 mb-8">
                                            <div className="p-3 bg-blue-600 rounded-2xl shadow-lg shadow-blue-500/20 text-white">
                                                <Icon name="sliders" className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h3 className="text-2xl font-bold text-white">System Environment</h3>
                                                <p className="text-sm text-gray-500">Manage global portal configurations and security.</p>
                                            </div>
                                        </div>

                                        <form className="space-y-8" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleUpdateSettings({
                                                businessName: f.get('businessName'),
                                                adminPin: f.get('adminPin'),
                                                theme: f.get('theme'),
                                                currency: f.get('currency'),
                                                systemAlert: f.get('systemAlert'),
                                                maintenanceMode: f.get('maintenanceMode') === 'on'
                                            });
                                        }}>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                <Input label="Business Identity" name="businessName" defaultValue={settings.businessName} icon="building" required />
                                                <Input label="Admin Portal PIN" name="adminPin" defaultValue={settings.adminPin} maxLength={4} icon="key" required />
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                <div className="space-y-3">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-widest">Interface Theme</label>
                                                    <div className="grid grid-cols-2 gap-3">
                                                        <label className={`cursor-pointer group relative p-4 rounded-xl border-2 transition-all flex items-center gap-3 ${settings.theme === 'dark' ? 'border-blue-600 bg-blue-600/10' : 'border-white/5 bg-white/5 hover:border-white/10'}`}>
                                                            <input type="radio" name="theme" value="dark" defaultChecked={settings.theme === 'dark'} className="hidden" onChange={() => setSettings({ ...settings, theme: 'dark' })} />
                                                            <Icon name="moon" className={settings.theme === 'dark' ? 'text-blue-400' : 'text-gray-500'} />
                                                            <span className={`font-bold transition-colors ${settings.theme === 'dark' ? 'text-white' : 'text-gray-500'}`}>Deep Dark</span>
                                                        </label>
                                                        <label className={`cursor-pointer group relative p-4 rounded-xl border-2 transition-all flex items-center gap-3 ${settings.theme === 'light' ? 'border-blue-600 bg-blue-600/10' : 'border-white/5 bg-white/5 hover:border-white/10'}`}>
                                                            <input type="radio" name="theme" value="light" defaultChecked={settings.theme === 'light'} className="hidden" onChange={() => setSettings({ ...settings, theme: 'light' })} />
                                                            <Icon name="sun" className={settings.theme === 'light' ? 'text-blue-400' : 'text-gray-500'} />
                                                            <span className={`font-bold transition-colors ${settings.theme === 'light' ? 'text-white' : 'text-gray-500'}`}>Soft Light</span>
                                                        </label>
                                                    </div>
                                                </div>

                                                <div className="space-y-3">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-widest">Default Currency</label>
                                                    <select name="currency" defaultValue={settings.currency} className="w-full bg-white/5 border border-white/10 rounded-xl py-4 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold appearance-none">
                                                        <option value="NGN">NGN (₦) - Naira</option>
                                                        <option value="USD">USD ($) - US Dollar</option>
                                                        <option value="EUR">EUR (€) - Euro</option>
                                                        <option value="GBP">GBP (£) - British Pound</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-xs font-bold text-gray-400 uppercase tracking-widest">Broadcast Alert Message</label>
                                                    <span className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Displays to all users</span>
                                                </div>
                                                <textarea
                                                    name="systemAlert"
                                                    defaultValue={settings.systemAlert}
                                                    className="w-full bg-white/5 border border-white/10 rounded-xl py-4 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold min-h-[100px]"
                                                    placeholder="Enter system announcement or maintenance notice..."
                                                ></textarea>
                                            </div>

                                            <div className="flex items-center gap-4 p-4 bg-orange-500/5 border border-orange-500/20 rounded-2xl">
                                                <div className="p-2 bg-orange-500/20 rounded-lg">
                                                    <Icon name="alert-triangle" className="text-orange-400" />
                                                </div>
                                                <div className="flex-1">
                                                    <p className="font-bold text-white text-sm">Maintenance Mode</p>
                                                    <p className="text-xs text-gray-500">Enable this to restricted client access while you perform updates.</p>
                                                </div>
                                                <input type="checkbox" name="maintenanceMode" defaultChecked={settings.maintenanceMode} className="w-6 h-6 rounded-lg bg-white/5 border-white/10 accent-orange-500" />
                                            </div>

                                            <Button variant="primary" className="w-full py-4 text-lg glow" icon="save">Commit System Changes</Button>
                                        </form>
                                    </Card>
                                </div>
                            )}
                    </main>

                    {/* Modals */}
                    {modal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#0f172a]/90 backdrop-blur-xl" onClick={() => setModal(null)}></div>
                            <div className="relative z-10 w-full max-w-lg">
                                <Card className="border-white/10 p-6 md:p-8 shadow-3xl bg-[#1e293b]/50 backdrop-blur-2xl">
                                    <div className="flex justify-between items-center mb-8">
                                        <h3 className="text-xl md:text-2xl font-black text-white tracking-tighter">
                                            {modal.type === 'transaction' ? 'RECORD ENTRY' :
                                                modal.type === 'addClient' ? 'CREATE WALLET' :
                                                    modal.type === 'editClient' ? 'UPDATE PROFILE' : 'PROVISION STAFF'}
                                        </h3>
                                        <button onClick={() => setModal(null)} className="p-2 hover:bg-white/5 rounded-full transition-colors text-gray-400 hover:text-white"><Icon name="x" /></button>
                                    </div>

                                    {modal.type === 'transaction' && (
                                        <form className="space-y-6" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleTransactionSubmit({
                                                clientId: f.get('clientId'),
                                                type: f.get('type'),
                                                amount: f.get('amount'),
                                                method: f.get('method')
                                            });
                                        }}>
                                            <div className="space-y-2">
                                                <label className="text-sm font-bold text-gray-400 uppercase tracking-widest">Select Client</label>
                                                <select name="clientId" className="w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold appearance-none" defaultValue={modal.data?.id || ''} required>
                                                    <option value="" disabled>Choose a wallet...</option>
                                                    {clients.map(c => <option key={c.id} value={c.id}>{c.name} ({formatMoney(c.balance)})</option>)}
                                                </select>
                                            </div>
                                            <div className="grid grid-cols-2 gap-6">
                                                <div className="space-y-2">
                                                    <label className="text-sm font-bold text-gray-400 uppercase tracking-widest">Method</label>
                                                    <select name="method" className="w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold appearance-none">
                                                        <option value="Cash">Cash</option>
                                                        <option value="Transfer">Bank Transfer</option>
                                                        <option value="POS">POS Terminal</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-sm font-bold text-gray-400 uppercase tracking-widest">Type</label>
                                                    <select name="type" className="w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold appearance-none">
                                                        <option value="DEPOSIT" className="text-emerald-400">Deposit</option>
                                                        <option value="WITHDRAWAL" className="text-red-400">Withdrawal</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <Input label="Amount" name="amount" type="number" icon="banknote" placeholder="0.00" required />
                                            <Button className="w-full" variant="primary">Authorize Transaction</Button>
                                        </form>
                                    )}

                                    {modal.type === 'addClient' && (
                                        <form className="space-y-6" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleAddClient({ name: f.get('name'), phone: f.get('phone') });
                                        }}>
                                            <Input label="Full Name" name="name" icon="user" placeholder="E.g. John Doe" required />
                                            <Input label="Phone Number" name="phone" icon="phone" placeholder="080..." maxLength={11} required />
                                            <Button className="w-full" variant="primary">Register Client Wallet</Button>
                                        </form>
                                    )}

                                    {modal.type === 'editClient' && (
                                        <form className="space-y-6" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleEditClient(modal.data.id, { name: f.get('name'), phone: f.get('phone') });
                                        }}>
                                            <Input label="Full Name" name="name" defaultValue={modal.data.name} icon="user" required />
                                            <Input label="Phone Number" name="phone" defaultValue={modal.data.phone} icon="phone" maxLength={11} required />
                                            <Button className="w-full" variant="primary">Update Profile</Button>
                                        </form>
                                    )}

                                    {modal.type === 'addStaff' && (
                                        <form className="space-y-6" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleAddStaff({ name: f.get('name'), pin: f.get('pin') });
                                        }}>
                                            <Input label="Staff Name" name="name" icon="shield" placeholder="Officer Name" required />
                                            <Input label="Security PIN" name="pin" type="text" icon="key" placeholder="4-Digit PIN" maxLength={4} required />
                                            <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold">This staff will use this PIN to access the Yomola Command Center.</p>
                                            <Button className="w-full" variant="danger">Provision Access Port</Button>
                                        </form>
                                    )}

                                    {modal.type === 'withdrawal' && (
                                        <form className="space-y-6" onSubmit={(e) => {
                                            e.preventDefault();
                                            const f = new FormData(e.target);
                                            handleRequestWithdrawal({
                                                amount: f.get('amount'),
                                                method: f.get('method'),
                                                note: f.get('note')
                                            });
                                        }}>
                                            <Input label="Withdrawal Amount" name="amount" type="number" icon="banknote" placeholder="0.00" required />
                                            <div className="space-y-2">
                                                <label className="text-sm font-bold text-gray-400 uppercase tracking-widest">Preferred Method</label>
                                                <select name="method" className="w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold appearance-none">
                                                    <option value="Transfer">Bank Transfer</option>
                                                    <option value="Cash">Cash Pickup</option>
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-sm font-bold text-gray-400 uppercase tracking-widest">Additional Notes (Optional)</label>
                                                <textarea name="note" className="w-full bg-gray-800/50 border border-white/10 rounded-xl py-3 px-4 text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold min-h-[80px]" placeholder="Bank details or reason..."></textarea>
                                            </div>
                                            <Button className="w-full" variant="primary">Submit Request</Button>
                                        </form>
                                    )}
                                </Card>
                            </div>
                        </div>
                    )
                    }
                </div >
            );
        };

        const ActivityList = ({ loading, transactions, isAdminView }) => {
            return (
                <div className="space-y-4">
                    {loading ? (
                        <div className="text-center py-20 flex flex-col items-center gap-4">
                            <div className="w-12 h-12 border-4 border-blue-600/20 border-t-blue-500 rounded-full animate-spin"></div>
                            <p className="text-gray-500 uppercase tracking-widest text-xs font-bold">Synchronizing Ledger...</p>
                        </div>
                    ) : transactions.length > 0 ? (
                        <div className="grid grid-cols-1 gap-4">
                            {transactions.slice(0, 10).map(t => (
                                <div key={t.id} className="glass group p-5 rounded-2xl flex items-center justify-between border-white/5 hover:bg-white/5 transition-all duration-300">
                                    <div className="flex items-center gap-6">
                                        <div className={`p-4 rounded-2xl shadow-inner ${t.type === 'DEPOSIT' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                                            <Icon name={t.type === 'DEPOSIT' ? 'plus' : 'minus'} className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <p className="font-bold text-lg text-white">{t.type === 'DEPOSIT' ? 'Deposit' : 'Withdrawal'}</p>
                                                {isAdminView && <span className="text-[10px] bg-white/5 px-2 py-0.5 rounded-full text-gray-500">ID: {t.clientId.slice(-4)}</span>}
                                            </div>
                                            <p className="text-xs text-gray-500 font-medium uppercase tracking-widest">
                                                {formatDate(t.date)} • {t.method} {t.recordedBy ? `• ${t.recordedBy}` : ''}
                                            </p>
                                        </div>
                                    </div>
                                    <p className={`text-2xl font-black ${t.type === 'DEPOSIT' ? 'text-emerald-400' : 'text-red-400'}`}>
                                        {t.type === 'DEPOSIT' ? '+' : '-'}{formatMoney(t.amount)}
                                    </p>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="glass p-20 text-center text-gray-500 rounded-3xl border-dashed border-white/5">
                            <Icon name="folder-open" className="w-12 h-12 mx-auto mb-4 opacity-20" />
                            <p className="font-medium">No activity recorded for this period.</p>
                        </div>
                    )}
                </div>
            );
        };

        const TransactionTable = ({ transactions, clients }) => {
            return (
                <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                        <thead className="bg-white/5 text-gray-500 uppercase text-[10px] font-black tracking-[0.2em]">
                            <tr>
                                <th className="px-6 py-4">Date</th>
                                <th className="px-6 py-4">Client</th>
                                <th className="px-6 py-4">Type</th>
                                <th className="px-6 py-4">Amount</th>
                                <th className="px-6 py-4">Recorded By</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-white/5">
                            {transactions.map(t => (
                                <tr key={t.id} className="hover:bg-white/5 transition-colors">
                                    <td className="px-6 py-4 text-sm text-gray-400">{formatDate(t.date)}</td>
                                    <td className="px-6 py-4 font-bold text-white">{clients.find(c => c.id === t.clientId)?.name || 'Unknown'}</td>
                                    <td className="px-6 py-4">
                                        <span className={`px-2 py-1 rounded-md text-[10px] font-bold ${t.type === 'DEPOSIT' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                                            {t.type}
                                        </span>
                                    </td>
                                    <td className={`px-6 py-4 font-black ${t.type === 'DEPOSIT' ? 'text-emerald-400' : 'text-red-400'}`}>{formatMoney(t.amount)}</td>
                                    <td className="px-6 py-4 text-xs text-gray-500">{t.recordedBy || 'System'}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        // --- LANDING PAGE ---
        const LandingPage = ({ onGetStarted }) => {
            return (
                <div className="min-h-screen bg-[#0f172a] overflow-x-hidden">
                    {/* Floating Background Blobs */}
                    <div className="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-600/10 blur-[120px] rounded-full"></div>
                    <div className="absolute bottom-[20%] left-[-10%] w-[400px] h-[400px] bg-indigo-600/10 blur-[100px] rounded-full"></div>

                    {/* Navbar */}
                    <nav className="relative z-10 px-6 py-8 flex justify-between items-center max-w-7xl mx-auto">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-500/20">
                                <Icon name="activity" className="text-white" />
                            </div>
                            <span className="text-2xl font-bold tracking-tighter text-white">Yomola Global</span>
                        </div>
                        <div className="hidden md:flex gap-8 text-gray-400 font-medium">
                            <a href="#about" className="hover:text-blue-400 transition">About</a>
                            <a href="#solutions" className="hover:text-blue-400 transition">Solutions</a>
                            <a href="#security" className="hover:text-blue-400 transition">Security</a>
                        </div>
                        <Button variant="secondary" onClick={onGetStarted} className="border-white/10 glass text-white">
                            Portals
                        </Button>
